    User:
      $ref: ./components/schemas/user.yaml
    Slider:
      $ref: ./components/schemas/slider.yaml
    SuccessResponse:
      $ref: ./components/schemas/success-response.yaml
    ErrorResponse:
      $ref: ./components/schemas/error-response.yaml
